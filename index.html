<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Космическая регистрация</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- Космический фон -->
    <div class="space"></div>
    <div class="milky-way"></div>
    
    <!-- Туманности -->
    <div class="nebula" style="width: 500px; height: 500px; background: radial-gradient(circle, #4a0080, #1a0040); top: 10%; left: 5%;"></div>
    <div class="nebula" style="width: 600px; height: 400px; background: radial-gradient(circle, #003366, #00001a); bottom: 15%; right: 8%; animation-delay: -10s;"></div>
    <div class="nebula" style="width: 350px; height: 350px; background: radial-gradient(circle, #660044, #330022); top: 50%; left: 60%; animation-delay: -20s;"></div>
    <div class="nebula" style="width: 450px; height: 450px; background: radial-gradient(circle, #1a0044, #000022); bottom: 30%; left: 20%; animation-delay: -5s;"></div>

    <!-- Слой звёзд -->
    <div class="stars-layer" id="starsLayer"></div>

    <!-- Форма регистрации -->
    <div class="auth-container" id="authContainer">
        <div class="auth-title">✨ Космическая регистрация</div>
        <p class="auth-subtitle">Создайте аккаунт для доступа к звёздам</p>

        <form id="registerForm">
            <div class="form-group">
                <label for="username">👤 Имя пользователя</label>
                <input type="text" id="username" placeholder="Введите имя" required />
            </div>

            <div class="form-group">
                <label for="email">📧 Email</label>
                <input type="email" id="email" placeholder="Введите email" required />
            </div>

            <div class="form-group">
                <label for="password">🔒 Пароль</label>
                <input type="password" id="password" placeholder="Минимум 6 символов" required minlength="6" />
            </div>

            <div class="form-group">
                <label for="passwordConfirm">✅ Подтвердите пароль</label>
                <input type="password" id="passwordConfirm" placeholder="Повторите пароль" required />
            </div>

            <button type="submit" class="register-btn">🚀 Зарегистрироваться</button>
        </form>

        <div id="message" class="message"></div>

        <div class="login-link">
            Уже есть аккаунт? <a href="#" id="showLogin">Войти</a>
        </div>
    </div>

    <!-- Форма входа (скрыта по умолчанию) -->
    <div class="auth-container" id="loginContainer" style="display: none;">
        <div class="auth-title">🚀 Вход в систему</div>
        <p class="auth-subtitle">Добро пожаловать обратно!</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="loginEmail">📧 Email</label>
                <input type="email" id="loginEmail" placeholder="Введите email" required />
            </div>

            <div class="form-group">
                <label for="loginPassword">🔒 Пароль</label>
                <input type="password" id="loginPassword" placeholder="Введите пароль" required />
            </div>

            <button type="submit" class="register-btn">🌌 Войти</button>
        </form>

        <div id="loginMessage" class="message"></div>

        <div class="login-link">
            Нет аккаунта? <a href="#" id="showRegister">Зарегистрироваться</a>
        </div>
    </div>

    <!-- Панель после входа (скрыта) -->
    <div class="auth-container" id="welcomeContainer" style="display: none;">
        <div class="auth-title">🌟 Добро пожаловать!</div>
        <p class="auth-subtitle" id="welcomeUser">Вы вошли в систему</p>
        <button class="register-btn" id="logoutBtn" style="margin-top: 20px;">🚪 Выйти</button>
    </div>

    <script src="stars.js"></script>
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Космос Among Us</title>
    <style>
        /* Сброс отступов и полное перекрытие экрана */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            /* Градиент синий → фиолетовый (вертикальный) */
            background: linear-gradient(180deg, #0a0a5c 0%, #4a1a6b 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Roboto, sans-serif;
            overflow: hidden; /* убираем скролл, если звёзды выходят за край */
            position: relative;
        }

        /* Контейнер для звёздного слоя — поверх градиента */
        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;   /* чтобы звёзды не мешали кликам по будущему контенту */
            z-index: 1;
        }

        /* Стиль каждой звезды */
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 6px 2px rgba(255, 255, 255, 0.6);
            animation: float-star linear infinite;
            opacity: 0.8;
        }

        /* Анимация движения — как в Among Us (плавное смещение вверх-вниз с лёгким дрейфом) */
        @keyframes float-star {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0.9;
            }
            25% {
                transform: translate(8px, -12px) scale(1.2);
                opacity: 1;
            }
            50% {
                transform: translate(-6px, -20px) scale(0.9);
                opacity: 0.7;
            }
            75% {
                transform: translate(10px, -8px) scale(1.1);
                opacity: 1;
            }
            100% {
                transform: translate(-4px, 0) scale(1);
                opacity: 0.9;
            }
        }

        /* Дополнительный слой с текстом (или будущим контентом) — поверх звёзд */
        .content {
            position: relative;
            z-index: 2;
            color: white;
            text-align: center;
            padding: 2rem;
            text-shadow: 0 0 20px rgba(100, 70, 255, 0.7);
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(2px);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            max-width: 800px;
            margin: 20px;
            pointer-events: auto; /* чтобы можно было взаимодействовать с текстом */
        }

        h1 {
            font-size: 3.2rem;
            font-weight: 700;
            letter-spacing: 4px;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #b0d0ff, #d9b0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        p {
            font-size: 1.4rem;
            opacity: 0.9;
            margin-top: 10px;
            letter-spacing: 1px;
        }

        /* Адаптив */
        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; }
            p { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <!-- Слой со звёздами (генерируется через JS) -->
    <div class="stars-container" id="starsContainer"></div>

    <!-- Основной контент (для примера) -->
    <div class="content">
        <h1>✦ Следи за звёздами ✦</h1>
        <p>Движение как в Among Us<br>Градиент синий → фиолетовый</p>
    </div>

    <script>
        (function() {
            const container = document.getElementById('starsContainer');
            const starCount = 120; // количество звёзд

            // Размеры окна
            const winWidth = window.innerWidth;
            const winHeight = window.innerHeight;

            // Функция генерации случайного числа в диапазоне
            const rand = (min, max) => Math.random() * (max - min) + min;

            // Создаём звёзды
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';

                // Случайный размер (от 2 до 6 пикселей)
                const size = rand(2, 6);
                star.style.width = size + 'px';
                star.style.height = size + 'px';

                // Случайная позиция по всему экрану
                star.style.left = rand(0, 100) + '%';
                star.style.top = rand(0, 100) + '%';

                // Индивидуальная скорость анимации (чтобы двигались не синхронно)
                // от 4 до 12 секунд на один цикл
                const duration = rand(5, 14);
                star.style.animationDuration = duration + 's';

                // Небольшой разброс задержки старта
                star.style.animationDelay = rand(0, 5) + 's';

                // Случайная яркость (немного варьируем opacity)
                star.style.opacity = rand(0.5, 1);

                // Добавляем лёгкое свечение разного цвета (от белого до голубоватого/фиолетового)
                const hue = rand(200, 290); // 200-240 синий, 260-290 фиолетовый
                star.style.boxShadow = `0 0 ${rand(4, 12)}px ${rand(1, 4)}px hsla(${hue}, 80%, 70%, 0.6)`;
                star.style.background = `hsl(${hue}, 90%, 85%)`;

                container.appendChild(star);
            }

            // Опционально: обновлять позиции при изменении размера окна?
            // Для простоты оставляем статичную раскладку, но звёзды будут двигаться в пределах своих % координат.
            // Можно пересоздавать при ресайзе, но это не обязательно.

            // Если нужно пересоздавать при ресайзе (чтобы звёзды не вылезали за пределы) — раскомментируйте:
            /*
            window.addEventListener('resize', () => {
                // Просто очищаем и заново генерируем
                container.innerHTML = '';
                // Повторяем цикл создания (код выше)
                // Для краткости здесь не дублирую, но можно вынести в функцию createStars()
            });
            */
        })();
    </script>

</body>
</html>
